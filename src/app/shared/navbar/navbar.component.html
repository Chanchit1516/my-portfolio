<header id="navbar" class="navbar-shell fixed-top" [class.navbar-scrolled]="isScrolled">
  <nav class="navbar navbar-expand-lg container" aria-label="Primary navigation">
    <a class="navbar-brand" href="#header" (click)="hideCollapseToggler()">
      <span class="brand-bracket">&lt;</span>Chanchit<span class="brand-dot">.dev</span><span class="brand-bracket"> /&gt;</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="onCollapseMobile()"
      [attr.aria-expanded]="isCollapse"
      aria-controls="navbarToggler"
      aria-label="Toggle navigation">
      <i class="fa-solid" [class.fa-bars]="!isCollapse" [class.fa-xmark]="isCollapse" aria-hidden="true"></i>
    </button>

    <div class="collapse navbar-collapse" id="navbarToggler" [class.show]="isCollapse">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
        <li class="nav-item" *ngFor="let item of navItems">
          <a
            class="nav-link"
            [class.active]="activeSection === item.id"
            [attr.aria-current]="activeSection === item.id ? 'page' : null"
            [href]="'#' + item.id"
            (click)="hideCollapseToggler()">
            {{ item.label }}
          </a>
        </li>
        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
          <a class="btn-nav-cta" href="#contact" (click)="hideCollapseToggler()">Let's Talk</a>
        </li>
      </ul>
    </div>
  </nav>
</header>
